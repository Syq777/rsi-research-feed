name: Update research feed

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'site.json'
      - 'topics/**'
      - 'catalog/**'
      - 'editorial/**'
      - 'editions/**'
      - 'research/**'
      - '*.py'
      - 'tests/**'
      - '.github/workflows/research-feed.yml'

concurrency:
  group: research-feed-publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run checks
        run: python3 -B -m unittest discover -s tests
      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Refresh the archive and render the site
        env:
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 update.py
      - name: Research candidates with citations (optional)
        if: vars.RESEARCH_MODEL != ''
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
        run: python3 -B research_ai.py --root .
      - name: Save the research archive and generated website in this repository
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- state/ public/ research/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update research archive and website'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and RSS
        id: deployment
        uses: actions/deploy-pages@v5.0.1
